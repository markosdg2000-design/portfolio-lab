name: Sync SEC 13F data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5,17 * * *"
  push:
    branches: [main]
    paths:
      - "managers.json"
      - "scripts/sync_sec.py"
      - ".github/workflows/sync-sec.yml"

permissions:
  contents: write

concurrency:
  group: sec-13f-sync-v2
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch SEC 13F disclosures
        continue-on-error: true
        env:
          SEC_USER_AGENT: "PortfolioLab/1.0 markosdg2000-design@users.noreply.github.com"
          SEC_REQUEST_PAUSE: "0.4"
          SEC_PERIODS_PER_MANAGER: "4"
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "import urllib.request; u='https://13f.info/data/13f/000135069426000003'; b=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 PortfolioLab'}),timeout=30).read(); open('data/debug-holdings.json','wb').write(b); print(len(b))" 2>&1 | tee data/action-log.txt
          python -m py_compile scripts/sync_sec.py 2>&1 | tee -a data/action-log.txt
          python scripts/sync_sec.py 2>&1 | tee -a data/action-log.txt
      - name: Commit refreshed public data
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "portfolio-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: refresh SEC 13F disclosures"
          git push
