name: Deploy Portfolio Lab to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync SEC 13F data"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "tests/**"
      - "managers.json"
      - "data/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Validate app and finance constraints
        run: |
          node --check app.js
          node tests/verify.cjs
      - name: Build static site
        run: |
          mkdir -p _site
          cp index.html managers.json styles.css app.js _site/
          cp -R data _site/data
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
